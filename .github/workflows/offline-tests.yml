name: Locked install and offline scientific-security tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install hash-verified wheels in a fresh virtual environment
        run: bash scripts/setup.sh
      - name: Check installed inventory and public dependency advisories
        run: .venv/bin/python scripts/dependency_check.py --installed --advisories
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: node --test tests/*.mjs
      - run: .venv/bin/python scripts/release_check.py
