name: Locked install and offline scientific-security tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install hash-verified wheels in a fresh virtual environment
        run: bash scripts/setup.sh
      - name: Check installed inventory and public dependency advisories
        run: .venv/bin/python scripts/dependency_check.py --installed --advisories
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: node --test tests/*.mjs
      - run: .venv/bin/python scripts/release_check.py
